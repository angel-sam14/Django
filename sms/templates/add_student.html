<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="post">
        {% csrf_token %}
        <p>
            <label for="">Name:</label>
            <input type="text" placeholder="Enter name" name="name">
        </p>
        <p>
            <label for="">Age:</label>
            <input type="number" placeholder="Enter age" name="age">
        </p>
        <p>
            <label for="">Mark:</label>
            <input type="number" placeholder="Enter mark" name="mark">
        </p>
        <label for="">Course:</label>
        <select name="course" id="">
            <option value="" selected disabled>
                ----------Select a course---------
            </option>
            <option value="BBA">BBA</option>
            <option value="BBA">BCA</option>
            <option value="BBA">BSC</option>
            <option value="BBA">MCA</option>
            <option value="BBA">MSC</option>
        </select>
        <p>
            <input type="submit" value="Add Student">
        </p>
    </form>
</body>
</html>
